title: Scheduled Task Created via schtasks.exe with Shell Action
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: test
description: >
  Detects schtasks.exe creating a task whose action (/tr) launches a shell
  interpreter (cmd.exe, powershell.exe, wscript.exe, etc.) — a common
  adversary pattern for T1053.005 persistence. Especially suspicious when
  the task runs as SYSTEM (/ru system) or originates from a Temp directory.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Garfield McLeod
date: 2026-06-19
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_schtasks:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains: '/create'
  selection_shell_action:
    CommandLine|contains:
      - 'cmd.exe'
      - 'powershell.exe'
      - 'wscript.exe'
      - 'cscript.exe'
      - 'mshta.exe'
      - 'rundll32.exe'
  filter_known_admin_tools:
    ParentImage|startswith:
      - 'C:\Program Files\'
      - 'C:\Program Files (x86)\'
      - 'C:\Windows\System32\services.exe'
  condition: selection_schtasks and selection_shell_action and not filter_known_admin_tools
falsepositives:
  - Legitimate admin scripts that schedule maintenance tasks
  - Software installers creating scheduled update tasks
level: high
fields:
  - Image
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - User
  - CurrentDirectory
